<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALL about frames</title>
  <link rel="stylesheet" href="../activity-nav.css">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      box-sizing: border-box;
      padding: 8px;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }

    nav {
      display: grid;
      height: 100%;
      grid-template-rows: repeat(4, minmax(0, 1fr)) auto;
      gap: 8px;
    }

    nav a {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
      border-radius: 6px;
      background: #166534;
      color: #fff;
      font-size: 27px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
    }

    nav a:hover,
    nav a:focus {
      background: #14532d;
    }

    nav .activity-home {
      grid-row: 5;
      justify-self: start;
      font-size: 15px;
    }

    @media (max-width: 600px) {
      body {
        height: 100%;
        padding: 6px;
      }

      nav {
        height: 100%;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr)) auto;
        gap: 6px;
      }

      nav a {
        min-width: 0;
        min-height: 48px;
        padding: 8px;
        font-size: clamp(14px, 4vw, 18px);
      }

      nav .activity-home {
        grid-column: 1 / -1;
        grid-row: 3;
        min-height: 38px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

<nav>
  <a class="activity-home" href="../midterm,exam/home.html" target="_top" aria-label="Back">
    <span class="activity-home__arrow" aria-hidden="true">&larr;</span>
    <span>Back</span>
  </a>
  <a href="../resume/index.html" target="mainstage">Resume</a>
  <a href="../bullets/bullets.html" target="mainstage">Bullets</a>
  <a href="../table/table.html" target="mainstage">Calendar &amp; Table</a>
  <a href="loser-video.html" target="mainstage">LOSER VIDEO</a>
</nav>

</body>
</html>
