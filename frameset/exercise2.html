<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALL about frames</title>
  <link rel="stylesheet" href="../activity-nav.css">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 0;
      min-height: 100%;
      margin: 0;
    }

    body {
      background: #0f172a;
      font-family: Arial, sans-serif;
    }

    .frames-layout {
      display: grid;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 8px;
      padding: 8px;
    }

    .frames-nav,
    .frames-content iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      border: 1px solid #334155;
      background: #f1f5f9;
    }

    .frames-content {
      display: grid;
      min-width: 0;
      min-height: 0;
      grid-template-rows: minmax(100px, 20fr) minmax(0, 80fr);
      gap: 8px;
    }

    @media (max-width: 600px) {
      .frames-layout {
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 190px minmax(0, 1fr);
        gap: 6px;
        padding: 6px;
      }

      .frames-nav {
        height: 190px;
      }

      .frames-content {
        grid-template-rows: minmax(100px, 16%) minmax(0, 1fr);
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <main class="frames-layout">
    <iframe class="frames-nav" src="exercise1.html" title="Activity navigation"></iframe>
    <section class="frames-content" aria-label="Selected activity">
      <iframe src="https://ieti.edu.ph/" title="IETI College website"></iframe>
      <iframe src="../bullets/bullets.html" name="mainstage" title="Activity content"></iframe>
    </section>
  </main>
</body>
</html>
