<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identification Card</title>
<link rel="stylesheet" href="idcard.css">
</head>
<body>

<div class="card">
  <div class="header">
    <div class="logo-sm">IETI<img src="images/logo1.png" alt="IETI logo" onerror="this.remove()"></div>
    <div class="school">
      <h1>IETI College and Technology, Inc. Marikina Campus</h1>
      <p>Your Pa$$port to Work Here and Aboard</p>
    </div>
  </div>

  <div class="body">
    <div>
      <div class="photo">PHOTO<img src="images/kevi1.png" alt="Student photo" onerror="this.remove()"></div>
      <div class="id-no">ID: 2026-0411</div>
    </div>

    <div class="info">
      <div class="field name">
        <label>Name</label>
        <span>John Kevin B. Lomio</span>
      </div>
      <div class="field">
        <label>Course and Section</label>
        <span>Bachelor of Science in Information Technology</span>
      </div>
      <div class="field">
        <label>Date of Birth</label>
        <span>Dec 22, 2004</span>
      </div>
    </div>
  </div>

  <div class="footer">STUDENT 2025-2026</div>
</div>

</body>
</html>
